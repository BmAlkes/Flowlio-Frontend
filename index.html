<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Pixel is loaded from src/utils/loadMetaPixel.ts, only after the
         visitor grants marketing cookie consent (see CookieConsentBanner). -->

    <!-- Primary SEO -->
    <meta name="description" content="Flowlio is the all-in-one business platform for freelancers and agencies — manage leads, clients, projects, tasks, time tracking, invoices and proposals in one place." />
    <meta name="keywords" content="project management, CRM, client management, invoicing, time tracking, proposals, leads, agency software, freelancer tools, workflow automation" />
    <meta name="author" content="Flowlio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://flowlioapp.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowlio" />
    <meta property="og:title" content="Flowlio — Manage Clients, Projects & Invoices in One Place" />
    <meta property="og:description" content="From first lead to final invoice — Flowlio connects every step of your business into one seamless workflow." />
    <meta property="og:url" content="https://flowlioapp.com/" />
    <meta property="og:image" content="https://flowlioapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flowlio — Manage Clients, Projects & Invoices in One Place" />
    <meta name="twitter:description" content="From first lead to final invoice — Flowlio connects every step of your business into one seamless workflow." />
    <meta name="twitter:image" content="https://flowlioapp.com/og-image.png" />

    <meta name="theme-color" content="#1797B9" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <link rel="preload" href="/src/index.css" as="style" />

    <!-- DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@100..900&display=swap" rel="stylesheet">


    <!-- Fallback for fonts -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/logo/logo.png" />
    <title>Flowlio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
