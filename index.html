<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta

  content="Flowlio CRM is a workspace built for project-based businesses. Manage clients, projects, tasks, and time in one simple, connected platform."
/>
<meta property="og:type" content="website" />

/>

<meta
  property="og:image"

/>

    <meta name="theme-color" content="#ffffff" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx" as="script" />

    <!-- DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"

      onload="this.media='all'"
    />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@100..900&display=swap" rel="stylesheet">

      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/logo/logo.png" />
    <title>Flowlio</title>
  </head>

</html>
